# Elderly Care AI Monitoring System - Configuration
# ==================================================

# Database Settings (MongoDB)
database:
  # MongoDB connection string - change this to your MongoDB instance
  connection_string: "mongodb://localhost:27017/"
  
  # Database name
  database_name: "elderly_care_ai"
  
  # Batch write settings for performance
  batch_size: 50
  flush_interval: 2.0  # seconds
  
  # Movement storage interval (store every Nth frame to reduce DB load)
  movement_store_interval: 5

# Model Settings
model:
  # Available models: yolov8n-pose, yolov8s-pose, yolov8m-pose, yolov8l-pose, yolov8x-pose
  # n=nano (fastest), s=small, m=medium, l=large, x=extra-large (most accurate)
  name: "yolov8m-pose"
  
  # Confidence threshold for detections (0.0 - 1.0)
  confidence_threshold: 0.5
  
  # IOU threshold for Non-Maximum Suppression
  iou_threshold: 0.45
  
  # Device: 'cuda', 'cpu', or device id (0, 1, etc.)
  # Set to 'auto' to automatically select GPU if available
  device: "auto"

# Detection Settings
detection:
  # Classes to detect (0 = person in COCO dataset)
  classes:
    - 0
  
  # Maximum number of detections per frame
  max_detections: 10
  
  # Track humans across frames
  enable_tracking: true
  
  # Tracking algorithm: 'bytetrack' or 'botsort'
  tracker: "bytetrack"

# Activity Detection Settings
activity_detection:
  # Angle threshold for standing detection (degrees from vertical)
  standing_angle_threshold: 30
  
  # Hip-knee height ratio for sitting detection
  sitting_hip_knee_ratio: 0.6
  
  # Aspect ratio threshold for lying detection (height/width)
  lying_aspect_ratio: 0.5
  
  # Movement threshold (pixels) to consider person as moving
  movement_threshold: 10
  
  # Movement threshold for walking detection
  walking_movement_threshold: 15
  
  # Seconds of no movement before marking as inactive
  inactivity_duration: 30
  
  # Number of frames to keep in history
  history_length: 30

# Fall Detection Settings
fall_detection:
  # Velocity threshold for fall detection (pixels/frame)
  velocity_threshold: 150
  
  # Height drop ratio threshold (0.4 = 40% drop triggers alert)
  height_drop_ratio: 0.4
  
  # Orientation angle threshold (degrees from vertical)
  orientation_threshold: 60
  
  # Number of frames to confirm fall
  confirmation_frames: 5
  
  # Cooldown between fall alerts (seconds)
  cooldown_duration: 5.0
  
  # History length for fall detection
  history_length: 15

# Emotion Detection Settings
emotion_detection:
  # DeepFace detector backend: 'opencv', 'retinaface', 'mtcnn', 'ssd', 'dlib', 'mediapipe'
  # 'opencv' is fastest, 'retinaface' is most accurate
  detector_backend: "opencv"
  
  # Emotion model name (DeepFace uses pre-trained models)
  model_name: "Emotion"
  
  # Minimum confidence for emotion detection
  confidence_threshold: 0.4
  
  # History length for mood tracking
  history_length: 30
  
  # Temporal smoothing window size (reduces flickering)
  smoothing_window: 5
  
  # Threshold for distress detection (sum of negative emotions)
  distress_threshold: 0.6
  
  # Minimum face size for detection (pixels)
  min_face_size: 40
  
  # Detection interval in seconds (caching for performance)
  detection_interval: 0.1

# Alert Settings
alerts:
  # Inactivity alert threshold (seconds)
  # Alert when person has been inactive for this long
  inactivity_threshold: 1800  # 30 minutes
  
  # Missing person alert threshold (seconds)
  # Alert when person leaves camera view for this long
  missing_threshold: 600  # 10 minutes
  
  # Enable sound alerts
  enable_sound: true
  
  # Alert severity levels: critical, high, medium, low
  fall_severity: "critical"
  inactivity_severity: "high"
  distress_severity: "high"
  emotion_severity: "medium"
  missing_severity: "medium"

# Pose Estimation Settings
pose:
  # Draw skeleton connections
  draw_skeleton: true
  
  # Draw keypoint circles
  draw_keypoints: true
  
  # Keypoint confidence threshold
  keypoint_confidence: 0.5
  
  # Skeleton line thickness
  skeleton_thickness: 2
  
  # Keypoint circle radius
  keypoint_radius: 5

# Video Input Settings
video:
  # Default video source (0 = webcam, or path to video file)
  source: 0
  
  # Frame width (set to null for original resolution)
  width: 640
  
  # Frame height (set to null for original resolution)
  height: 480
  
  # FPS limit (set to null for no limit)
  fps_limit: 30

# Output Settings
output:
  # Save output video
  save_video: true
  
  # Output directory for saved videos
  output_dir: "outputs"
  
  # Video codec (mp4v, XVID, etc.)
  codec: "mp4v"
  
  # Show real-time display
  show_display: true
  
  # Save detection data to JSON
  save_json: true
  
  # JSON output directory
  json_dir: "outputs/detections"
  
  # Save session logs
  save_logs: true
  
  # Logs directory
  logs_dir: "outputs/logs"

# Visualization Settings
visualization:
  # Bounding box color (BGR format)
  bbox_color:
    - 0
    - 255
    - 0
  
  # Bounding box thickness
  bbox_thickness: 2
  
  # Show confidence scores
  show_confidence: true
  
  # Show person ID (when tracking enabled)
  show_id: true
  
  # Font scale for text
  font_scale: 0.6
  
  # Text color (BGR)
  text_color:
    - 255
    - 255
    - 255
  
  # Show skeleton overlay
  show_skeleton: true
  
  # Show activity status
  show_activity: true
  
  # Show emotion status
  show_emotion: true
  
  # Show alerts on screen
  show_alerts: true
  
  # Show video feed
  # Set to false to show only detection overlay on black background
  show_video_feed: false

# Keypoint Configuration (COCO format - 17 keypoints)
keypoints:
  names:
    - "nose"
    - "left_eye"
    - "right_eye"
    - "left_ear"
    - "right_ear"
    - "left_shoulder"
    - "right_shoulder"
    - "left_elbow"
    - "right_elbow"
    - "left_wrist"
    - "right_wrist"
    - "left_hip"
    - "right_hip"
    - "left_knee"
    - "right_knee"
    - "left_ankle"
    - "right_ankle"
  
  # Skeleton connections (pairs of keypoint indices)
  skeleton:
    - [0, 1]   # nose -> left_eye
    - [0, 2]   # nose -> right_eye
    - [1, 3]   # left_eye -> left_ear
    - [2, 4]   # right_eye -> right_ear
    - [5, 6]   # left_shoulder -> right_shoulder
    - [5, 7]   # left_shoulder -> left_elbow
    - [7, 9]   # left_elbow -> left_wrist
    - [6, 8]   # right_shoulder -> right_elbow
    - [8, 10]  # right_elbow -> right_wrist
    - [5, 11]  # left_shoulder -> left_hip
    - [6, 12]  # right_shoulder -> right_hip
    - [11, 12] # left_hip -> right_hip
    - [11, 13] # left_hip -> left_knee
    - [13, 15] # left_knee -> left_ankle
    - [12, 14] # right_hip -> right_knee
    - [14, 16] # right_knee -> right_ankle
